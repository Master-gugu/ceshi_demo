<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        账号输入框：<input type="text" id="username">
        <br>
        密码输入框：<input type="password" id="password">
    </div>
    <div onclick="fetchData()">提交</div>

    <script>
        function fetchData() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            fetch('http://th57g8.natappfree.cc/api/user/userLogin', {
                method: 'POST', // 指定请求方法
                headers: {
                    'Content-Type': 'application/json' // 设置请求头
                },
                body: JSON.stringify({ name: username, password: password }) // 将数据转换为 JSON 字符串
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                console.log('Response?:', data);
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            });
        }
        
    </script>
</body>
</html>
